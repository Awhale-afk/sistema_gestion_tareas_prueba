<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea una cuenta</title>
    <link rel="stylesheet" href="estilosLogin.CSS">
</head>
<body>
    <header>
        <nav id="navBar">
            <img src="images/todoListoLogo.png" id="logoNav" alt="To-do listo logo">
            <a class="opcionesNavBar" href="/login">Inicia sesión</a>
            <a class="opcionesNavBar" href="/registro">Crea una cuenta</a>
        </nav>
    </header>

    <div id="registroContent">
        <h1>¿Listo para crear tu cuenta?</h1>
        <div id="divCredenciales">
            <p>Usuario</p>
            <input id="inputUsuario" class="inputCredenciales" type="text">
            <p>Correo</p>
            <input id="inputCorreo" class="inputCredenciales" type="text">
            <p>Contraseña</p>
            <input id="inputContraseña" class="inputCredenciales" type="text">
            <button id="registrarme">Registrarme</button>
        </div>
    </div>

    <script src="logica_converted_js/registro.js"></script>
</body>
</html>
